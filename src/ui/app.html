<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Social Zeitgeist</title>
<link rel="stylesheet" href="/ui/kit.css">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body class="ui-root" data-theme="light">
<div class="sz" id="app">
  <header class="ui-topbar sz__top">
    <div class="ui-topbar__group">
      <span class="ui-topbar__brand">Social Zeitgeist</span>
      <span class="ui-topbar__divider"></span>
      <span class="ui-topbar__status" id="status">loading</span>
    </div>
    <div class="ui-topbar__group">
      <button class="ui-topbar__item" type="button" id="theme" aria-label="Toggle dark mode">Dark</button>
      <button class="ui-topbar__item ui-topbar__outline" type="button" id="refresh">Refresh</button>
      <a class="ui-topbar__share" id="setupLink" href="#">Setup</a>
    </div>
  </header>
  <div class="sz__side">
    <nav class="ui-rail" aria-label="Pages" id="rail"></nav>
  </div>
  <main class="sz__main"><div class="page" id="page"></div></main>
</div>
<div class="toast-area" id="toasts"></div>
<script>
(() => {
  const KEY_NAME = "sz_key";
  const qs = new URLSearchParams(location.search);
  if (qs.get("key")) { try { localStorage.setItem(KEY_NAME, qs.get("key")); } catch {} history.replaceState(null, "", location.pathname + location.hash); }
  let key = null; try { key = localStorage.getItem(KEY_NAME); } catch {}
  if (!key) { document.getElementById("page").innerHTML = '<div class="card"><p class="ui-text">Open this page from the link with your key.</p></div>'; return; }
  document.getElementById("setupLink").href = `/setup?key=${encodeURIComponent(key)}`;

  const ICONS = {
    now: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="4"/>',
    moments: '<path d="M4 18c3-6 5-9 8-9s5 3 8 9"/><path d="M4 12h16"/>',
    posts: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/>',
    accounts: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14c2.8 0 5.5 2 5.5 5"/>',
    formats: '<rect x="3" y="5" width="7" height="14" rx="2"/><rect x="14" y="5" width="7" height="9" rx="2"/>',
    mm: '<path d="M4 20V6l5 8 5-8v14"/><path d="M17 6h3v14"/>',
    test: '<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/>',
  };
  const PAGES = [["now", "Now"], ["moments", "Moments"], ["posts", "Posts"], ["accounts", "Accounts"], ["formats", "Formats"], ["mm", "MM"], ["test", "Test"]];

  const $ = (s, el = document) => el.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  const api = async (name, args = {}) => {
    const res = await fetch("/api/tool", { method: "POST", headers: { "content-type": "application/json", "x-sz-key": key }, body: JSON.stringify({ name, args }) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    return d.result;
  };
  const toast = (msg) => {
    const t = document.createElement("div");
    t.className = "ui-toast"; t.setAttribute("role", "status"); t.setAttribute("data-theme", "dark"); t.style.cssText = "position:static;translate:none";
    t.innerHTML = `<p class="ui-toast__message">${esc(msg)}</p><button class="ui-toast__ok" type="button">Ok</button>`;
    t.querySelector("button").onclick = () => t.remove();
    $("#toasts").appendChild(t); setTimeout(() => t.remove(), 5000);
  };
  const badge = (state) => {
    const kind = { new: "info", rising: "positive", peak: "warn", cooling: "assist", gone: "assist" }[state] || "assist";
    return `<span class="ui-badge ui-badge--${kind}">${esc(state)}</span>`;
  };
  const plat = (p) => `<span class="ui-badge ui-badge--contrast">${esc(p)}</span>`;
  const link = (url, text) => url ? `<a class="plain" href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : text;
  const postRow = (p, { extra = "" } = {}) => `
    <div class="row" data-post="${esc(p.id)}">
      <div class="row__main">
        <div class="row__meta">${plat(p.platform)} <span class="ui-text--bold">${esc(p.account)}</span> · ${esc(p.format)} · ${esc(p.age)}${p.repost ? " · repost" : ""}${extra}</div>
        <div class="row__text">${link(p.url, esc(p.text))}</div>
      </div>
      <div class="row__side"><div class="num num--big">${esc(p.vs_normal || "")}</div><div class="small muted">${p.pace ? `${esc(p.pace)} pace` : ""}<br>${[p.likes ? `${Number(p.likes).toLocaleString()} likes` : "", p.comments ? `${Number(p.comments).toLocaleString()} comments` : "", p.shares ? `${Number(p.shares).toLocaleString()} shares` : "", p.views ? `${Number(p.views).toLocaleString()} views` : ""].filter(Boolean).join(" · ")}</div></div>
    </div>`;
  const momentRow = (m, current) => `
    <button class="row" type="button" data-moment="${esc(m.id)}" ${current ? 'aria-current="true"' : ""}>
      <div class="row__main">
        <div class="row__title">${esc(m.label)}</div>
        <div class="row__meta">${badge(m.state)} ${(m.platforms || []).map(plat).join(" ")} · ${m.accounts} accounts · ${m.posts} posts · ${esc(m.last_post)}${m.mm_fit ? ` · MM ${esc(m.mm_fit)}` : ""}${m.mm_covered ? ` · covered ${esc(m.mm_covered)}` : ""}</div>
      </div>
      <div class="row__side"><div class="num num--big">${Number(m.score).toFixed(1)}</div><div class="small muted">${m.direction === "up" ? "rising" : m.direction === "down" ? "falling" : "steady"}</div></div>
    </button>`;
  const card = (title, body, { span = 6, head = "", cls = "" } = {}) => `<section class="card span-${span} ${cls}"><div class="card__head"><h2 class="ui-title ui-title--small">${esc(title)}</h2>${head}</div>${body}</section>`;
  const feedbackButtons = (momentId, postId) => `
    <div class="actions" data-fb="${esc(momentId || "")}" data-fbpost="${esc(postId || "")}">
      <button class="ui-button ui-button--primary ui-button--small" type="button" data-value="posted">Posted it</button>
      <button class="ui-button ui-button--secondary ui-button--small" type="button" data-value="liked">Good idea, not now</button>
      <button class="ui-button ui-button--tertiary ui-button--small" type="button" data-value="passed">Not for us</button>
    </div>`;

  let brief = null;
  const page = $("#page");
  const setStatus = (s) => { $("#status").textContent = s; };

  async function loadBrief(fresh = false) {
    page.classList.add("loading");
    try { brief = await api("sz_now", { fresh }); setStatus(`brief ${new Date(brief.as_of).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} · ${brief.counts.accounts} accounts · ${brief.counts.posts_72h} posts in 72h · ${brief.counts.moments} moments`); }
    catch (e) { setStatus("could not load"); toast(e.message); }
    page.classList.remove("loading");
  }

  // ---- pages ----
  const render = {
    async now() {
      if (!brief) await loadBrief();
      const b = brief; if (!b) return;
      page.className = "page page--now";
      const hero = b.post_now ? `
        <div class="row__meta">${badge(b.post_now.state)} ${(b.post_now.platforms || []).map(plat).join(" ")} · started ${esc(b.post_now.started)} · ${b.post_now.accounts} accounts${b.post_now.best_format ? ` · ${esc(b.post_now.best_format)} doing best` : ""}</div>
        <div class="hero__label">${esc(b.post_now.label)}</div>
        <p class="ui-text hero__why">${esc(b.post_now.why)}</p>
        ${(b.post_now.top_posts || []).slice(0, 1).map((p) => `<div class="hero__post">${postRow(p)}</div>`).join("")}
        ${b.post_now.mm_closest?.length ? `<dl class="kv" style="margin-top:16px"><dt>MM's closest</dt><dd>${b.post_now.mm_closest.slice(0, 2).map((m) => `${link(m.url, esc(m.caption))} <span class="muted">(${m.pct ?? "?"}th pct, ${esc(m.posted_at)})</span>`).join("<br>")}</dd></dl>` : ""}
        ${feedbackButtons(b.post_now.id)}` : `<div class="empty">Nothing is moving yet. Add accounts on the setup page and give it an hour.</div>`;
      page.innerHTML = [
        card("Post now", hero, { span: 7, cls: "card--hero" }),
        card("Moving", `<div class="list">${b.moving.slice(1, 7).map((m) => momentRow(m)).join("") || '<div class="empty">No moments yet</div>'}</div>`, { span: 5 }),
        card("Out-performing their own account", `<div class="list">${b.outperformers.slice(0, 6).map((p) => postRow(p)).join("") || '<div class="empty">Nothing yet</div>'}</div>`, { span: 7, head: '<span class="small muted">last 48h</span>' }),
        card("Gaps for MM", b.gaps.length ? `<div class="list">${b.gaps.map((g) => `<button class="row" type="button" data-moment="${esc(g.id)}"><div class="row__main"><div class="row__title">${esc(g.label)}</div><div class="row__meta">MM ${esc(g.mm_fit)}${g.best_format ? ` · ${esc(g.best_format)}` : ""}</div><div class="row__text">${esc(g.why)}</div></div><div class="row__side"><div class="num num--big">${Number(g.score).toFixed(1)}</div></div></button>`).join("")}</div>` : '<div class="empty">No gaps right now: everything MM\'s history likes, MM has covered or isn\'t moving.</div>', { span: 5 }),
        card("Gaining fastest", `<div class="list">${b.fastest.slice(0, 5).map((p) => postRow(p)).join("") || '<div class="empty">Needs a few hours of readings</div>'}</div>`, { span: 4, head: '<span class="small muted">last 24h</span>' }),
        card("Format pulse", formatTable(b.format_pulse), { span: 4, head: '<span class="small muted">this week vs last</span>' }),
        card("Accounts this week", `<table class="tbl"><tr><th>Account</th><th class="r">Typical</th><th class="r">Best</th></tr>${b.accounts_this_week.map((a) => `<tr><td>${plat(a.platform)} ${esc(a.account)} <span class="muted small">${esc(a.category)}, ${a.posts} posts</span></td><td class="r num">${esc(a.typical)}</td><td class="r">${esc(a.best)}</td></tr>`).join("") || '<tr><td colspan="3" class="empty">Nothing yet</td></tr>'}</table>`, { span: 4 }),
        card("Meaningful Minute, lately", `<div class="list">${b.mm_recent.slice(0, 6).map((p) => postRow(p)).join("") || '<div class="empty">MM\'s own posts appear once the Instagram connector is polled</div>'}</div>`, { span: 7, head: '<span class="small muted">against MM\'s own normal</span>' }),
        card("Cooling", b.cooling.length ? `<div class="list">${b.cooling.map((c) => `<button class="row" type="button" data-moment="${esc(c.id)}"><div class="row__main"><div class="row__title">${esc(c.label)}</div><div class="row__meta">peak ${Number(c.peak).toFixed(1)} · now ${Number(c.heat).toFixed(1)}</div></div></button>`).join("")}</div>` : '<div class="empty">Nothing cooling</div>', { span: 5 }),
      ].join("");
    },
    async moments() {
      page.className = "page page--split";
      page.innerHTML = `<div><div class="toolbar">${segmented("mstate", ["all", "new", "rising", "peak", "cooling"], "all")}</div><div class="list" id="mlist"><div class="empty">Loading</div></div></div><div class="detail" id="mdetail"><div class="card"><div class="empty">Pick a moment</div></div></div>`;
      const load = async () => {
        const state = page.querySelector('[data-seg="mstate"] [aria-checked="true"]').dataset.v;
        const rows = await api("sz_moments", { limit: 40, ...(state !== "all" ? { state } : {}) });
        $("#mlist").innerHTML = rows.map((m) => momentRow(m)).join("") || '<div class="empty">No moments</div>';
        if (rows[0] && !$("#mdetail .hero__label")) showMoment(rows[0].id);
      };
      page.addEventListener("segchange", load);
      await load();
    },
    async posts() {
      page.className = "page";
      page.innerHTML = `<div class="toolbar">
        ${segmented("sort", ["outperformance", "pace", "newest", "engagement"], "outperformance")}
        ${select("platform", ["all", "instagram", "x", "telegram", "bluesky", "reddit"], "all")}
        ${select("hours", ["24", "48", "168", "336"], "48", (v) => `${v} hours`)}
        <label class="ui-input"><input class="ui-input__field" id="pq" placeholder="Search text" autocomplete="off"></label>
        <label class="ui-text small"><input type="checkbox" id="pself"> include MM</label>
      </div><div class="list" id="plist"><div class="empty">Loading</div></div>`;
      const load = async () => {
        const args = { sort: page.querySelector('[data-seg="sort"] [aria-checked="true"]').dataset.v, hours: Number($("#sel-hours").value), limit: 60, include_self: $("#pself").checked };
        if ($("#sel-platform").value !== "all") args.platform = $("#sel-platform").value;
        if ($("#pq").value.trim()) args.query = $("#pq").value.trim();
        const rows = await api("sz_posts", args);
        $("#plist").innerHTML = rows.map((p) => postRow(p, { extra: p.moment_id ? ` · <a class="plain" href="#moments/${esc(p.moment_id)}">in a moment</a>` : "" })).join("") || '<div class="empty">Nothing matches</div>';
      };
      page.addEventListener("segchange", load);
      page.addEventListener("change", load);
      $("#pq").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
      await load();
    },
    async accounts() {
      page.className = "page";
      const rows = await api("sz_accounts", { include_inactive: true });
      page.innerHTML = `<section class="card" style="margin-bottom:24px"><div class="card__head"><h2 class="ui-title ui-title--small">Add an account</h2></div>
        <form class="toolbar" id="addForm" style="margin:0">
          ${select("ap", ["instagram", "x", "telegram", "bluesky", "reddit"], "instagram")}
          <label class="ui-input" style="width:220px"><input class="ui-input__field" name="handle" placeholder="handle, channel or subreddit" required autocomplete="off"></label>
          ${select("ac", ["peer", "big", "niche", "news", "creator", "org", "self"], "peer")}
          <label class="ui-input" style="width:90px"><input class="ui-input__field" name="weight" value="1" aria-label="Weight"></label>
          <button class="ui-button ui-button--primary" type="submit">Add</button>
        </form><p class="ui-text ui-text--secondary small" style="margin-top:8px">Instagram accounts must be professional (business or creator). Weight 0.2 to 2 says how much that account's attention counts.</p></section>
        <table class="tbl"><tr><th>Platform</th><th>Account</th><th>Category · weight</th><th class="r">Normal</th><th class="r">This week</th><th>Status</th><th></th></tr>
        ${rows.map((a) => `<tr data-acct="${esc(a.id)}"><td>${plat(a.platform)}</td><td><span class="ui-text--bold">${esc(a.handle)}</span>${a.display ? `<br><span class="muted small">${esc(a.display)}</span>` : ""}${a.followers ? `<br><span class="muted small">${Number(a.followers).toLocaleString()} followers</span>` : ""}</td><td>${esc(a.category)} · ${a.weight}</td><td class="r small">${Object.entries(a.normal_engagement || {}).map(([k, v]) => `${esc(k)} ${esc(v)}`).join("<br>") || "<span class='muted'>no baseline yet</span>"}</td><td class="r">${esc(a.this_week || "")}</td><td>${!a.active ? '<span class="ui-badge ui-badge--assist">paused</span>' : a.error ? `<span class="ui-badge ui-badge--critical">error</span> <span class="small muted">${esc(a.error.slice(0, 80))}</span>` : `<span class="ui-badge ui-badge--positive">ok</span> <span class="small muted">${a.polled ? new Date(a.polled).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : ""}</span>`}</td><td style="white-space:nowrap"><button class="ui-button ui-button--tertiary ui-button--small" data-act="${a.active ? "pause" : "resume"}">${a.active ? "Pause" : "Resume"}</button> <button class="ui-button ui-button--tertiary ui-button--small" data-act="remove">Remove</button></td></tr>`).join("")}</table>`;
      $("#addForm").onsubmit = async (e) => {
        e.preventDefault();
        const f = e.target;
        try { const r = await api("sz_track", { action: "add", platform: $("#sel-ap").value, handle: f.handle.value, category: $("#sel-ac").value, weight: Number(f.weight.value) || 1 }); toast(r.note || "Added"); render.accounts(); } catch (err) { toast(err.message); }
      };
      page.onclick = async (e) => {
        const b = e.target.closest("[data-act]"); if (!b) return;
        const id = b.closest("tr").dataset.acct; const [platform, handle] = id.split(":");
        if (b.dataset.act === "remove" && !confirm(`Remove ${id}?`)) return;
        try { await api("sz_track", { action: b.dataset.act, platform, handle }); toast(`${b.dataset.act} ${id}`); render.accounts(); } catch (err) { toast(err.message); }
      };
    },
    async formats() {
      page.className = "page page--now";
      const f = await api("sz_formats", {});
      page.innerHTML = card("Formats, this week against last", formatTable(f), { span: 6 }) + card("Openers", f.openers.length ? `<table class="tbl"><tr><th>First line</th><th class="r">With</th><th class="r">Without</th><th class="r">n</th></tr>${f.openers.map((o) => `<tr><td>${esc(o.trait.replace("_", " "))}</td><td class="r num">${o.with}x</td><td class="r">${o.without}x</td><td class="r muted">${o.n}</td></tr>`).join("")}</table>` : '<div class="empty">Needs more posts</div>', { span: 6 }) + `<p class="ui-text ui-text--secondary span-12">Median result against each account's own normal. 1.0x is normal. ${f.posts_read} posts read.</p>`;
    },
    async mm() {
      page.className = "page page--split";
      page.innerHTML = `<div><div class="toolbar"><label class="ui-input" style="width:100%"><input class="ui-input__field" id="mmq" placeholder="Search MM's two years of posts" autocomplete="off"></label></div><div id="mmres"></div></div><div><section class="card"><div class="card__head"><h2 class="ui-title ui-title--small">MM lately</h2></div><div class="list" id="mmrecent"><div class="empty">Loading</div></div></section></div>`;
      const r = await api("sz_mm", { limit: 20 });
      $("#mmrecent").innerHTML = r.recent.map((p) => postRow(p)).join("") || '<div class="empty">No live MM posts yet</div>';
      $("#mmres").innerHTML = `<p class="ui-text ui-text--secondary">${r.history.posts} posts in the history, ${esc(r.history.first)} to ${esc(r.history.last)}.</p>`;
      $("#mmq").addEventListener("keydown", async (e) => {
        if (e.key !== "Enter") return;
        const q = e.target.value.trim(); if (!q) return;
        const res = await api("sz_mm", { query: q });
        $("#mmres").innerHTML = `<section class="card"><div class="card__head"><h2 class="ui-title ui-title--small">Closest MM posts</h2><span class="small muted">${res.fit !== null ? `fit ${Math.round(res.fit * 100)}th pct` : "no fit"}</span></div><div class="list">${res.matches.map((m) => `<div class="row"><div class="row__main"><div class="row__text">${link(m.url, esc(m.caption))}</div><div class="row__meta">${esc(m.format)} · ${esc(m.source)} · ${esc(m.posted_at)} · sim ${m.sim}</div></div><div class="row__side"><div class="num num--big">${m.pct ?? "?"}</div><div class="small muted">pct</div></div></div>`).join("") || '<div class="empty">Nothing close</div>'}</div></section>`;
      });
    },
    async test() {
      page.className = "page page--split";
      page.innerHTML = `<section class="card"><div class="card__head"><h2 class="ui-title ui-title--small">Test an idea</h2></div>
        <div class="ui-multiline"><textarea class="ui-multiline__field" id="idea" rows="6" placeholder="A subject, an angle, or a caption draft"></textarea></div>
        <div class="actions"><button class="ui-button ui-button--primary" id="runTest" type="button">Score it</button></div></section>
        <div id="tres"><div class="card"><div class="empty">The verdict lands here: MM's history, and which live moments it rides.</div></div></div>`;
      $("#runTest").onclick = async () => {
        const text = $("#idea").value.trim(); if (!text) return;
        $("#runTest").classList.add("loading");
        try {
          const r = await api("sz_test_idea", { text });
          $("#tres").innerHTML = `<section class="card"><div class="hero__label" style="font-size:20px;line-height:28px">${esc(r.verdict)}</div>
            <dl class="kv"><dt>MM fit</dt><dd>${r.mm.fit !== null ? `${Math.round(r.mm.fit * 100)}th percentile (closest match ${r.mm.strength})` : "no record"}</dd><dt>Covered</dt><dd>${r.covered_recently ? esc(r.covered_recently) : "not recently"}</dd></dl>
            <h3 class="ui-title ui-title--xsmall" style="margin:16px 0 8px">Closest MM posts</h3><div class="list">${r.mm.matches.map((m) => `<div class="row"><div class="row__main"><div class="row__text">${link(m.url, esc(m.caption))}</div><div class="row__meta">${esc(m.format)} · ${esc(m.posted_at)} · sim ${m.sim}</div></div><div class="row__side"><div class="num num--big">${m.pct ?? "?"}</div><div class="small muted">pct</div></div></div>`).join("") || '<div class="empty">Nothing close</div>'}</div>
            <h3 class="ui-title ui-title--xsmall" style="margin:16px 0 8px">Live moments it rides</h3><div class="list">${r.rides.map((m) => `<button class="row" type="button" data-moment="${esc(m.id)}"><div class="row__main"><div class="row__title">${esc(m.label)}</div><div class="row__meta">${badge(m.state)} ${m.accounts} accounts · match ${m.match}</div></div><div class="row__side num">${Number(m.score).toFixed(1)}</div></button>`).join("") || '<div class="empty">None right now</div>'}</div></section>`;
        } catch (e) { toast(e.message); }
        $("#runTest").classList.remove("loading");
      };
    },
  };

  function formatTable(f) {
    if (!f || !f.formats.length) return '<div class="empty">Needs a week of posts</div>';
    return `<table class="tbl"><tr><th>Format</th><th class="r">This week</th><th class="r">Last week</th><th class="r">n</th></tr>${f.formats.map((x) => `<tr><td>${esc(x.format)}</td><td class="r num">${x.this_week ?? ""}x</td><td class="r">${x.last_week ? `${x.last_week}x` : "none"}</td><td class="r muted">${x.n}</td></tr>`).join("")}</table>`;
  }
  function segmented(name, options, value) {
    const idx = Math.max(0, options.indexOf(value));
    return `<div class="ui-segmented" role="radiogroup" tabindex="0" data-seg="${name}" style="--ui-segmented-count: ${options.length}; --ui-segmented-index: ${idx}">${options.map((o, i) => `<div class="ui-segmented__item"><button class="ui-segmented__option" type="button" role="radio" tabindex="-1" aria-checked="${i === idx}" data-v="${esc(o)}">${esc(o)}</button></div>`).join("")}</div>`;
  }
  function select(name, options, value, label = (v) => v) {
    return `<select class="ui-input__field" id="sel-${name}" style="width:160px;height:40px;padding:0 12px;border:1px solid var(--ui-control-border);border-radius:var(--ui-radius-sharp);background:var(--ui-control-bg)" aria-label="${name}">${options.map((o) => `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc(label(o))}</option>`).join("")}</select>`;
  }

  async function showMoment(id) {
    const target = $("#mdetail");
    if (!target) { location.hash = `#moments/${id}`; return; }
    target.innerHTML = '<div class="card"><div class="empty">Loading</div></div>';
    page.querySelectorAll("[data-moment]").forEach((el) => el.toggleAttribute("aria-current", el.dataset.moment === id) || (el.dataset.moment === id ? el.setAttribute("aria-current", "true") : el.removeAttribute("aria-current")));
    try {
      const m = await api("sz_moment", { id, posts: 20 });
      target.innerHTML = `<section class="card">
        <div class="row__meta">${badge(m.state)} ${(m.platforms || []).map(plat).join(" ")} · started ${esc(m.started)} · last post ${esc(m.last_post)} · ${m.accounts} accounts · ${m.posts} posts</div>
        <div class="hero__label">${esc(m.label)}</div>
        <p class="ui-text">${esc(m.why)}</p>
        <dl class="kv" style="margin-top:12px"><dt>Score</dt><dd class="num">${m.score} <span class="muted">(heat ${m.heat}, ${m.direction})</span></dd><dt>Best format</dt><dd>${esc(m.best_format || "")}</dd><dt>Terms</dt><dd>${(m.terms || []).map((t) => `<span class="ui-badge ui-badge--assist">${esc(t)}</span>`).join(" ")}</dd><dt>MM fit</dt><dd>${esc(m.mm_fit || "no record")}${m.mm_covered ? ` · covered ${esc(m.mm_covered)}` : ""}</dd></dl>
        ${m.mm_closest?.length ? `<h3 class="ui-title ui-title--xsmall" style="margin:16px 0 8px">MM's closest posts</h3><div class="list">${m.mm_closest.map((c) => `<div class="row"><div class="row__main"><div class="row__text">${link(c.url, esc(c.caption))}</div><div class="row__meta">${esc(c.format)} · ${esc(c.posted_at)} · sim ${c.sim}</div></div><div class="row__side num num--big">${c.pct ?? "?"}</div></div>`).join("")}</div>` : ""}
        ${feedbackButtons(m.id)}
        ${m.feedback?.length ? `<p class="small muted" style="margin-top:8px">${m.feedback.map((f) => `${esc(f.value)} ${new Date(f.at).toLocaleDateString()}`).join(" · ")}</p>` : ""}
        <h3 class="ui-title ui-title--xsmall" style="margin:24px 0 8px">The posts</h3><div class="list">${m.top_posts.map((p) => postRow(p)).join("")}</div></section>`;
    } catch (e) { target.innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`; }
  }

  // ---- shell ----
  const rail = $("#rail");
  rail.innerHTML = PAGES.map(([id, label]) => `<button class="ui-rail__item" type="button" data-page="${id}"><span class="ui-rail__icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[id]}</svg></span>${label}</button>`).join("");
  rail.onclick = (e) => { const b = e.target.closest("[data-page]"); if (b) location.hash = `#${b.dataset.page}`; };
  async function route() {
    const [name, arg] = (location.hash.slice(1) || "now").split("/");
    const id = render[name] ? name : "now";
    rail.querySelectorAll("[data-page]").forEach((b) => b.toggleAttribute("aria-current", false) || (b.dataset.page === id ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
    page.onclick = null;
    page.classList.add("loading");
    try { await render[id](); } catch (e) { page.innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`; }
    page.classList.remove("loading");
    if (id === "moments" && arg) showMoment(arg);
  }
  window.addEventListener("hashchange", route);
  page.addEventListener("click", async (e) => {
    const seg = e.target.closest(".ui-segmented__option");
    if (seg) { const g = seg.closest(".ui-segmented"); g.querySelectorAll(".ui-segmented__option").forEach((o, i) => { o.setAttribute("aria-checked", o === seg); if (o === seg) g.style.setProperty("--ui-segmented-index", i); }); page.dispatchEvent(new Event("segchange")); return; }
    const fb = e.target.closest("[data-fb] [data-value]");
    if (fb) { const w = fb.closest("[data-fb]"); try { await api("sz_feedback", { moment_id: w.dataset.fb || undefined, post_id: w.dataset.fbpost || undefined, value: fb.dataset.value }); toast(`Noted: ${fb.textContent}`); } catch (err) { toast(err.message); } return; }
    const m = e.target.closest("[data-moment]");
    if (m && !e.target.closest("a")) { e.preventDefault(); showMoment(m.dataset.moment); }
  });
  $("#refresh").onclick = async () => { await loadBrief(true); route(); toast("Brief rebuilt"); };
  $("#theme").onclick = () => { const b = document.body; const dark = b.dataset.theme !== "dark"; b.dataset.theme = dark ? "dark" : "light"; $("#theme").textContent = dark ? "Light" : "Dark"; try { localStorage.setItem("sz_theme", b.dataset.theme); } catch {} };
  try { if (localStorage.getItem("sz_theme") === "dark") $("#theme").click(); } catch {}
  loadBrief().then(route);
})();
</script>
</body>
</html>
